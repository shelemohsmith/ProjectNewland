<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Newland</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      max-width: 760px;
      width: 100%;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.35);
      padding: 40px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.5rem, 5vw, 3.5rem);
      letter-spacing: -0.04em;
      color: #f8fafc;
    }
    p {
      line-height: 1.8;
      color: #cbd5e1;
      margin: 0 0 24px;
      font-size: 1.05rem;
    }
    .label {
      display: inline-block;
      margin-bottom: 24px;
      color: #7dd3fc;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-size: 0.83rem;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="label">Project Newland</div>
    <h1>Welcome to Project Newland</h1>
    <p>
      Project Newland is live and running. This homepage is the published site for the repository.
    </p>
    <p>
      The page is now serving the final site content, not setup instructions.
    </p>
    <p>
      If you want, I can also add a logo, sections, or your custom project details next.
    </p>
  </main>
</body>
</html>
